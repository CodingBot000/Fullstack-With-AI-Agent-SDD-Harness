name: Starter kit
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate starter only (not product quality)
        run: python3 scripts/harness.py verify --scope kit --report .harness/reports/kit.json
      - name: Read explicit project mode
        id: mode
        run: echo "mode=$(python3 scripts/harness.py mode)" >> "$GITHUB_OUTPUT"
      - name: Upload sanitized starter summary only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starter-kit-validation
          path: .harness/reports/kit.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  project:
    needs: kit
    if: needs.kit.outputs.mode == 'project'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Onboarding must add real runtime/dependency/test-service setup here.
      # Do not expose production secrets to untrusted PRs or silently skip evals.
      - name: Execute configured product gates
        run: python3 scripts/harness.py verify --scope project --report .harness/reports/project.json
